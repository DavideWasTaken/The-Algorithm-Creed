name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile runtime
        run: python -m compileall -q main.py publisher.py
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Parse Windows scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw "PowerShell syntax error in $($_.Name)" }
          }
